model:
  name: deftmamba_complex_mask_2ch_1src
  n_mics: 2
  n_srcs: 1
  n_layers: 4
  emb_dim: 64
  n_heads: 4
  emb_kernel_size: 4
  emb_hop_size: 1
  hidden_dim: 256
  dropout: 0.1
  eps: 1.0e-5

mask:
  parameterization: bounded_cartesian
  reference_channel: 0
  component_bound: 2.0
  head_init_std: 0.001
  identity_initialization: true

audio:
  sample_rate: 16000
  duration_seconds: 4
  n_fft: 512
  win_length: 512
  hop_length: 256
  window: hamming
  ri_packing: channel_major_interleaved
  center: true
  periodic: true
  normalized: false

model_contract:
  output_mode: complex_mask
  mask_parameterization: bounded_cartesian
  reference_channel: 0
  component_bound: 2.0
  contract_version: 1
